plugins {
    id 'com.android.application'
}

android {
    namespace 'com.airmusic.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.airmusic.player"
        minSdk 23
        targetSdk 34
        versionCode 312
        versionName "3.1.2"
    }

    signingConfigs {
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
  
      // AirPlay 1 (RAOP) engine
    implementation 'org.jmdns:jmdns:3.5.7'
    implementation 'io.netty:netty:3.10.6.Final'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.65'

    // 网络音乐路径：SMB/CIFS 客户端（WebDAV 用 HttpURLConnection，FTP 自己实现，都不需要依赖）
    // 它自带的 bcprov-jdk18on 与应用已有的 bcprov-jdk15on 包名重叠（Duplicate class），排除掉；
    // SMB2 走不到那部分加密，应用自带的 1.65 已足够。
    implementation('eu.agno3.jcifs:jcifs-ng:2.1.10') {
        exclude group: 'org.bouncycastle'
    }

    // 动态图标（Lottie）：载入 / 等待这类动画用它，图标本身的路径动画仍用
    // 原生 AnimatedVectorDrawable（矢量、无额外资源、TV 盒子上更省）。
    implementation 'com.airbnb.android:lottie:6.6.0'
}
